<div class="app-container">
  <mat-toolbar color="primary" class="toolbar">
    <span>NoteEase</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="toggleArchiveView()">
      <mat-icon>{{ showArchived ? 'note' : 'archive' }}</mat-icon>
    </button>
  </mat-toolbar>

  <div class="content">
    <div class="search-bar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search notes</mat-label>
        <input matInput type="text" (input)="onSearch($any($event.target).value)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="categories-container" *ngIf="allCategories.size > 0">
      <mat-chip-listbox [multiple]="true" class="mat-mdc-chip-set">
        @for (category of allCategories; track category) {
          <mat-chip-option 
            [selected]="isCategorySelected(category)"
            (selectionChange)="toggleCategory(category)">
            {{ category }}
          </mat-chip-option>
        }
      </mat-chip-listbox>
    </div>

    <div class="notes-grid">
      @for (note of filteredNotes$ | async; track note.id) {
        <app-note-card
          [note]="note"
          (onEdit)="openNoteDialog($event)"
          (onDelete)="onDeleteNote($event)"
          (onPin)="onPinNote($event)"
          (onArchive)="onArchiveNote($event)"
        />
      } @empty {
        <div class="no-notes">
          <mat-icon>note_add</mat-icon>
          <p>No notes to display. Click the + button to create one!</p>
        </div>
      }
    </div>

    <button mat-fab class="add-button" (click)="openNoteDialog()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

<router-outlet />
